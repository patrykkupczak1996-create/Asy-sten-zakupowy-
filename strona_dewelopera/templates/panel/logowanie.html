{% extends "panel/_baza.html" %}
{% block panel %}
<div class="karta" style="max-width:420px;margin:40px auto">
  <h1 style="font-size:1.8rem">Zaloguj się</h1>
  <form method="post" class="kontakt">
    <input type="hidden" name="csrf" value="{{ csrf() }}">
    <label>Hasło <input type="password" name="haslo" required autofocus autocomplete="current-password"></label>
    <button class="btn">Zaloguj</button>
  </form>
</div>
{% endblock %}
