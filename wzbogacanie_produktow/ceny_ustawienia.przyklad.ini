# Ustawienia cen — ceny.py. Zmieniaj śmiało; zapisz plik i uruchom skrypt ponownie.

[pliki]
# Cennik z Onninen: ścieżka do pliku albo adres URL
xml = onninen.xml
# Produkty sklepu (eksport z IdoSell z kolumnami @id, kod producenta, EAN)
produkty = produkty.csv
# Gdzie zapisywać wyniki (puste = folder programu)
folder_wynikow =

[marza]
# tryb = jedna  -> jedna marża dla wszystkich produktów (jedna_marza), progi i producenci są pomijani
# tryb = progi  -> marża wg progów ceny i wyjątków dla producentów
tryb = progi
jedna_marza = 25
# Progi: cena zakupu netto od (zł) : marża %. Każdy próg obowiązuje od swojej kwoty w górę.
# Przykład: do 50 zł +40%, od 50 zł +30%, od 200 zł +25%, od 1000 zł +18%, od 5000 zł +12%.
# Stała marża dla wszystkiego: progi = 0:25
progi = 0:40, 50:30, 200:25, 1000:18, 5000:12
# Zysk netto co najmniej tyle złotych na sztuce (chroni tanie drobiazgi)
minimalny_zysk_zl = 2
# Minimalny zysk w zł tylko dla sztuk — dla produktów na metry, kg, litry liczy się sama marża %
minimalny_zysk_tylko_sztuki = true
# Cena brutto nie wyższa niż katalogowa Onninen z feedu (ale nigdy poniżej zakupu + minimalny zysk)
nie_drozej_niz_katalogowa = false
vat = 23
# Zaokrąglenie ceny brutto w górę: 0.01 (grosz), 0.10, 1 (pełne złote), 0.99 (końcówka ,99)
zaokraglenie = 0.99

[producenci]
# Wyjątki: marża % dla całego producenta (zamiast progów). Nazwa jak w sklepie.
# GEBERIT = 20
# AFRISO = 30

[bezpiecznik]
# Ostrzeżenie w raporcie, gdy cena zmieni się o więcej niż tyle % od ostatniego przebiegu
max_zmiana_proc = 40
# Nie rób pliku importu, gdy dopasuje się mniej niż tyle % produktów co ostatnio (uszkodzony XML)
min_dopasowanych_proc = 80

[xml]
# Zwykle puste — skrypt sam rozpoznaje pola. Gdy źle zgadnie, wpisz nazwy pól z: py ceny.py --pokaz onninen.xml
# cena = cena_netto
# ean = ean
# kod = kod_producenta
# indeks = indeks

[sklep]
# Nazwy kolumn w produkty.csv (domyślnie jak w eksporcie IdoSell)
# kolumna_id = @id
# kolumna_kod = @code_producer
# kolumna_ean = /sizes/size@code_producer
# kolumna_producent = /producer@name

[wyjscie]
# Kolumny pliku ceny_do_importu.csv (oddzielone ;). Dostępne: @id, kod, ean, nazwa, zakup_netto,
# marza_proc, cena_netto, cena_brutto. Nazwy możesz zmienić pod import IdoSell.
kolumny = @id;kod;cena_netto;cena_brutto

[ftp]
# Opcjonalnie: po każdym przeliczeniu wyślij ceny_wszystkie.csv na FTP — IdoSell pobiera go stamtąd sam
# („Synchronizować towary w sposób ciągły od dostawcy”). Puste host = bez wysyłania.
host =
uzytkownik =
haslo =
folder =
tls = true

[automat]
# Godziny automatycznego przeliczania (ustawiane w programie Ceny)
godziny = 07:30, 14:30
